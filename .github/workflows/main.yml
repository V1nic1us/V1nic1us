name: Generate Datas

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3.2.0

        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#db2777&color_dots=#ede9fe,#c4b5fd,#a78bfa,#d28bea,#f472b6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f9a8d4&color_dots=#30263e,#77608e,#a78bfa,#d28bea,#f472b6
            dist/github-contribution-grid-snake.gif?color_snake=#f9a8d4&color_dots=#30263e,#77608e,#a78bfa,#d28bea,#f472b6&color_background=#111324
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build status
        run: git status

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
