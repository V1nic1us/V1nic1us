name: Atualizar gráficos do perfil

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/update-languages.yml

permissions:
  contents: write

concurrency:
  group: profile-languages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar coleta
        run: python -m unittest discover -s tests -v
      - name: Gerar painéis 3D das duas plataformas
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python scripts/update_languages.py
      - name: Atualizar visitantes únicos do repositório
        env:
          PROFILE_TRAFFIC_TOKEN: ${{ secrets.PROFILE_TRAFFIC_TOKEN }}
        run: |
          if [ -n "$PROFILE_TRAFFIC_TOKEN" ]; then
            python scripts/update_visitors.py
          else
            echo "PROFILE_TRAFFIC_TOKEN ausente; mantendo a última leitura de visitantes."
          fi
      - name: Salvar atualização
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-languages.svg assets/gitlab-languages.svg assets/visitors.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar linguagens do perfil"
            git push
          fi
