# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
include:
- template: Security/Secret-Detection.gitlab-ci.yml

# Create a pipeline schedule in GitLab with cron: 17 */12 * * * (UTC).
# Enable CI_JOB_TOKEN repository pushes; see docs/profile-automation.md.
update_profile_languages:
  stage: test
  image: python:3.12-slim
  resource_group: profile-languages
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
  script:
    - python -m unittest discover -s tests -v
    - python scripts/update_languages.py
    - |
      if [ -n "${PROFILE_TRAFFIC_TOKEN:-}" ]; then
        python scripts/update_visitors.py
      else
        echo "PROFILE_TRAFFIC_TOKEN ausente; mantendo a última leitura de visitantes."
      fi
    - git config user.name 'Profile Bot'
    - git config user.email "profile-bot@users.noreply.gitlab.com"
    - git add assets/github-languages.svg assets/gitlab-languages.svg assets/visitors.svg
    - |
      if ! git diff --cached --quiet; then
        git commit -m "chore: atualizar linguagens do perfil [skip ci]"
        git push -o ci.skip "$CI_REPOSITORY_URL" "HEAD:$CI_DEFAULT_BRANCH"
      fi
